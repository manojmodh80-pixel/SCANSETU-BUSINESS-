<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScanSetu Business Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

.card{
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
}

h2{
  margin-top:30px;
  border-bottom:1px solid #ddd;
  padding-bottom:8px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

input,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:80px;
  resize:vertical;
}

button{
  margin-top:20px;
  padding:13px 22px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.save{
  background:#111;
  color:#fff;
}

.load{
  background:#ddd;
  margin-left:8px;
}

.status{
  margin-top:15px;
  font-weight:bold;
}

.preview{
  margin-top:20px;
  padding:15px;
  background:#f3f3f3;
  border-radius:10px;
}

.small{
  color:#666;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>ScanSetu Business Dashboard</h1>

<p class="small">
Create and manage a separate smart QR page for every business.
</p>

<h2>Business Login</h2>

<label>Business ID</label>
<input id="businessId" placeholder="example: anantaa">

<label>Admin Password</label>
<input id="password" type="password" placeholder="Admin password">

<button class="load" onclick="loadBusiness()">LOAD BUSINESS</button>

<h2>Business Information</h2>

<label>Business Name</label>
<input id="siteName" placeholder="Your Business Name">

<label>Top Heading</label>
<input id="eyebrow" placeholder="SCAN ONCE. CONNECT WITH US.">

<label>Business Description</label>
<input id="subtitle" placeholder="Your business description">

<label>Logo URL</label>
<input id="logo" placeholder="https://...">

<h2>Google Review</h2>

<label>Review Button Title</label>
<input id="reviewTitle" value="GIVE US A GOOGLE REVIEW">

<label>Review Subtitle</label>
<input id="reviewSubtitle" value="Share your genuine experience">

<label>Google Review URL</label>
<input id="reviewUrl" placeholder="https://g.page/.../review">

<h2>Instagram</h2>

<label>Instagram Title</label>
<input id="instagramTitle" value="FOLLOW US ON INSTAGRAM">

<label>Instagram Subtitle</label>
<input id="instagramSubtitle" value="Latest updates • Reels • Offers">

<label>Instagram URL</label>
<input id="instagramUrl" placeholder="https://instagram.com/...">

<h2>Facebook</h2>

<label>Facebook Title</label>
<input id="facebookTitle" value="FOLLOW US ON FACEBOOK">

<label>Facebook Subtitle</label>
<input id="facebookSubtitle" value="Stay connected with us">

<label>Facebook URL</label>
<input id="facebookUrl" placeholder="https://facebook.com/...">

<h2>Payment</h2>

<label>Payment Title</label>
<input id="paymentTitle" value="PAY NOW">

<label>Payment Subtitle</label>
<input id="paymentSubtitle" value="UPI payment">

<label>UPI ID</label>
<input id="upiId" placeholder="example@bank">

<h2>Google Maps</h2>

<label>Maps Title</label>
<input id="mapsTitle" value="GET DIRECTIONS">

<label>Maps Subtitle</label>
<input id="mapsSubtitle" value="Find our business">

<label>Google Maps URL</label>
<input id="mapsUrl" placeholder="https://maps.google.com/...">

<h2>WhatsApp</h2>

<label>WhatsApp Title</label>
<input id="whatsappTitle" value="CHAT ON WHATSAPP">

<label>WhatsApp Subtitle</label>
<input id="whatsappSubtitle" value="Enquiries & details">

<label>WhatsApp URL</label>
<input id="whatsappUrl" placeholder="https://wa.me/...">

<h2>Phone</h2>

<label>Phone Title</label>
<input id="phoneTitle" value="CALL NOW">

<label>Phone Subtitle</label>
<input id="phoneSubtitle" value="Call our business">

<label>Phone Number</label>
<input id="phoneNumber" placeholder="+91XXXXXXXXXX">

<h2>Footer</h2>

<label>Footer Business Name</label>
<input id="footerName">

<label>Business Address</label>
<textarea id="footerAddress"></textarea>

<button class="save" onclick="saveBusiness()">SAVE BUSINESS</button>

<div id="status" class="status"></div>

<div class="preview">
<strong>Business Page URL:</strong>
<div id="pageUrl">Enter Business ID</div>
</div>

</div>
</div>

<script>

function value(id){
  return document.getElementById(id).value.trim();
}

function setValue(id,val){
  document.getElementById(id).value = val || "";
}

function updatePageUrl(){
  const id = value("businessId");

  if(id){
    document.getElementById("pageUrl").textContent =
      window.location.origin + "/?business=" + encodeURIComponent(id);
  }else{
    document.getElementById("pageUrl").textContent =
      "Enter Business ID";
  }
}

document.getElementById("businessId").addEventListener(
  "input",
  updatePageUrl
);

async function loadBusiness(){

  const businessId = value("businessId");

  if(!businessId){
    alert("Please enter Business ID");
    return;
  }

  const status = document.getElementById("status");
  status.textContent = "Loading...";

  try{

    const response = await fetch(
      "/api/config/" + encodeURIComponent(businessId),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("Business not found");
    }

    const c = await response.json();

    setValue("businessId",c.businessId || businessId);
    setValue("siteName",c.siteName);
    setValue("eyebrow",c.eyebrow);
    setValue("subtitle",c.subtitle);

    setValue("logo",c.logo && c.logo.url);

    setValue("reviewTitle",c.review && c.review.title);
    setValue("reviewSubtitle",c.review && c.review.subtitle);
    setValue("reviewUrl",c.review && c.review.url);

    setValue("instagramTitle",c.instagram && c.instagram.title);
    setValue("instagramSubtitle",c.instagram && c.instagram.subtitle);
    setValue("instagramUrl",c.instagram && c.instagram.url);

    setValue("facebookTitle",c.facebook && c.facebook.title);
    setValue("facebookSubtitle",c.facebook && c.facebook.subtitle);
    setValue("facebookUrl",c.facebook && c.facebook.url);

    setValue("paymentTitle",c.payment && c.payment.title);
    setValue("paymentSubtitle",c.payment && c.payment.subtitle);
    setValue("upiId",c.payment && c.payment.upiId);

    setValue("mapsTitle",c.maps && c.maps.title);
    setValue("mapsSubtitle",c.maps && c.maps.subtitle);
    setValue("mapsUrl",c.maps && c.maps.url);

    setValue("whatsappTitle",c.whatsapp && c.whatsapp.title);
    setValue("whatsappSubtitle",c.whatsapp && c.whatsapp.subtitle);
    setValue("whatsappUrl",c.whatsapp && c.whatsapp.url);

    setValue("phoneTitle",c.phone && c.phone.title);
    setValue("phoneSubtitle",c.phone && c.phone.subtitle);
    setValue("phoneNumber",c.phone && c.phone.number);

    setValue("footerName",c.footer && c.footer.name);
    setValue("footerAddress",c.footer && c.footer.address);

    updatePageUrl();

    status.textContent = "Business loaded ✓";

  }catch(error){

    console.error(error);
    status.textContent = "Business not found.";
  }
}

async function saveBusiness(){

  const businessId = value("businessId");
  const password = value("password");

  if(!businessId){
    alert("Please enter Business ID");
    return;
  }

  if(!password){
    alert("Please enter Admin Password");
    return;
  }

  const data = {

    businessId:businessId,

    siteName:value("siteName"),
    eyebrow:value("eyebrow"),
    subtitle:value("subtitle"),

    logo:{
      url:value("logo")
    },

    review:{
      title:value("reviewTitle"),
      subtitle:value("reviewSubtitle"),
      url:value("reviewUrl")
    },

    instagram:{
      title:value("instagramTitle"),
      subtitle:value("instagramSubtitle"),
      url:value("instagramUrl")
    },

    facebook:{
      title:value("facebookTitle"),
      subtitle:value("facebookSubtitle"),
      url:value("facebookUrl")
    },

    payment:{
      title:value("paymentTitle"),
      subtitle:value("paymentSubtitle"),
      upiId:value("upiId")
    },

    maps:{
      title:value("mapsTitle"),
      subtitle:value("mapsSubtitle"),
      url:value("mapsUrl")
    },

    whatsapp:{
      title:value("whatsappTitle"),
      subtitle:value("whatsappSubtitle"),
      url:value("whatsappUrl")
    },

    phone:{
      title:value("phoneTitle"),
      subtitle:value("phoneSubtitle"),
      number:value("phoneNumber")
    },

    footer:{
      name:value("footerName"),
      address:value("footerAddress")
    }
  };

  const status = document.getElementById("status");

  status.textContent = "Saving...";

  try{

    const response = await fetch(
      "/api/config/" + encodeURIComponent(businessId),
      {
        method:"PUT",

        headers:{
          "Content-Type":"application/json",
          "X-Admin-Password":password
        },

        body:JSON.stringify(data)
      }
    );

    const result = await response.json();

    if(!response.ok){
      throw new Error(result.error || "Save failed");
    }

    updatePageUrl();

    status.textContent =
      "Business saved successfully ✓";

  }catch(error){

    console.error(error);

    status.textContent =
      "Save failed: " + error.message;
  }
}

updatePageUrl();

</script>

</body>
</html>
