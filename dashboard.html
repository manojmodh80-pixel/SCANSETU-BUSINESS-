<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScanSetu Dashboard</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:auto;padding:24px;background:#f7f1e7;color:#35151b}input,textarea{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ccc;border-radius:10px}button{padding:12px 18px;border:0;border-radius:10px;background:#35151b;color:white}h1{font-family:Georgia,serif}.card{background:white;padding:18px;border-radius:16px;margin:15px 0}</style></head>
<body><h1>SCANSETU BUSINESS</h1><p>Retailer Dashboard</p>
<div class="card">
<label>Retailer ID / Slug</label><input id="slug" value="demo">
<label>Admin Password</label><input id="pass" type="password">
<label>Business Name</label><input id="name" value="Your Business">
<label>Tagline</label><input id="tagline" value="Connect with us instantly.">
<label>Links — one per line: Title | URL | Subtitle</label><textarea id="links" rows="9">Google Review | https://example.com | Share your genuine experience
Instagram | https://instagram.com/ | Follow us
WhatsApp | https://wa.me/ | Chat with us</textarea>
<button onclick="save()">SAVE BUSINESS</button> <button onclick="loadData()">LOAD</button>
<p id="msg"></p></div>
<script>
async function loadData(){const s=document.getElementById("slug").value.trim();const r=await fetch("/api/config/"+encodeURIComponent(s));if(!r.ok){msg("No saved business yet.");return}const c=await r.json();name.value=c.siteName||"";tagline.value=c.tagline||"";links.value=(c.links||[]).map(x=>`${x.title||""} | ${x.url||""} | ${x.subtitle||""}`).join("\n");msg("Loaded ✓")}
async function save(){const s=slug.value.trim();const rows=links.value.split("\n").map(x=>x.split("|").map(y=>y.trim())).filter(x=>x[1]);const body={siteName:name.value.trim(),tagline:tagline.value.trim(),links:rows.map(x=>({title:x[0],url:x[1],subtitle:x[2]||""}))};const r=await fetch("/api/config/"+encodeURIComponent(s),{method:"PUT",headers:{"Content-Type":"application/json","X-Admin-Password":pass.value},body:JSON.stringify(body)});msg(r.ok?"Saved ✓":"Save failed: "+await r.text())}
function msg(x){document.getElementById("msg").textContent=x}
</script></body></html>
